name: Infrastructure Tests

on: 
  push:
    branches: ["main"]
    paths: 
      - "ch5/tofu/live/lambda-sample/**"
      - "ch3/tofu/modules/lambda/**"
      - ".github/workflows/infra-tests.yaml"

jobs:
  opentofu_test:
    name: "Run OpenTofu tests"
    runs-on: ubuntu-latest
    permissions:                                                                
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: ch5/tofu/live/lambda-sample
    
    env:
      AWS_DEFAULT_REGION: ap-southeast-2
      AWS_REGION: ap-southeast-2
      TF_VAR_name: lambda-sample-${{ github.run_id }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show checkout information
        run: |
          echo "Commit:"
          git rev-parse HEAD

          echo "Branch:"
          git branch --show-current

          echo "Lambda module source:"
          grep -n -A 3 'module "function"' main.tf

          echo "OpenTofu version:"
          tofu version


      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          response=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          token=$(echo "$response" | jq -r '.value')

          TOKEN="$token" python3 - <<'PY'
          import os
          import json
          import base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]

          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          for key in ["iss", "aud", "sub", "repository", "ref"]:
              print(f"{key}: {claims.get(key)}")
          PY

          echo "GitHub repository: $GITHUB_REPOSITORY"
          echo "GitHub ref: $GITHUB_REF"
          echo "GitHub event: $GITHUB_EVENT_NAME"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3                          
        with:
          # TODO: fill in your IAM role ARN!
          role-to-assume: arn:aws:iam::405398623290:role/lambda-sample-tests    
          role-session-name: tests-${{ github.run_number }}-${{ github.actor }} 
          aws-region: ap-southeast-2
    
      - uses: opentofu/setup-opentofu@v1

      - name: Initialize OpenTofu
        run: tofu init -backend=false -input=false

      - name: Show installed providers
        run: tofu providers

      - name: Tofu Test
        run: tofu test -verbose                                                               

